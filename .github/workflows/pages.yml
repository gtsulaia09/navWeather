# Public demo on GitHub Pages: https://gtsulaia09.github.io/navWeather/
# The same app and the same static data as production (roads, search, places, heights, forecast, air quality), built
# under the /navWeather/ base path. Pages serves static files only, so the two features that need our Worker — live
# location sharing and driver reports — answer "not available"; the map uses the OpenFreeMap fallback styles. Rebuilt
# four times a day (forecast stays fresh) and on every push to main. Free: Actions minutes and Pages are free for
# public repositories. One-time setup: Settings → Pages → Source: GitHub Actions.
name: Pages demo

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Our data as static files (roads, search, places, heights, forecast, air quality)
        run: npm run data:all
      - name: Build under /navWeather/
        run: |
          npx tsc -b
          npx vite build --base /navWeather/
          # No basemap Worker on Pages: the app falls back to OpenFreeMap. Unknown paths get the app shell.
          rm -rf dist/data/basemap dist/_headers
          cp dist/index.html dist/404.html
          du -sh dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
