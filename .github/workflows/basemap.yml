# Our map background (ADR-020; pipelines/basemap/build.mjs): once a week, extract the world (zoom 0–6) and our
# regions (zoom 7–14) from the free Protomaps daily planet build (OpenStreetMap, ODbL — an open data file read with
# HTTP range requests; the volume does not depend on users), pack it and deploy it to the assets-only Worker
# `navweather-basemap`. Phones read only these static files — no tile server, nothing that can bill.
# Needs the same secrets as Deploy; without them a scheduled run does nothing.
name: Basemap

on:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: preview or production
        type: choice
        options: [preview, production]
        default: production

permissions:
  contents: read

concurrency:
  group: basemap-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  basemap:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.target || 'production' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
      TARGET: ${{ inputs.target || 'production' }}
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare credentials yet — nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - name: Build the basemap (world z0–6, regions z7–14)
        if: steps.creds.outputs.ok == 'true'
        run: npm run data:basemap -- --out dist-basemap
      - name: Deploy (static assets only)
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy -c wrangler.basemap.toml --env $TARGET --message "${{ github.sha }}"
