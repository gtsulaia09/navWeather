# navWeather on Cloudflare Workers, Free plan (ADR-019): the static app and all our data (dist/: roads, search,
# forecasts, air quality, heights, places — free and unlimited to serve) plus the two things users share: live
# location and driver reports (Durable Objects). Everything else runs on the device.
#
# No payment method on the account, no Workers Paid, no Containers, R2, D1 or Queues: the Free plan cannot bill. Past
# its daily limits (100,000 Worker requests; 100,000 Durable Object requests) the API answers with errors and the app
# says sharing or reports are busy until 00:00 UTC. Static files never count against those limits.
#
# Three environments, each its own Worker with its own Durable Objects and rate limits — preview never touches real
# users' data:
#   (top level) dev   `npm run dev` / `wrangler dev` — local only (local Durable Objects; no account)
#   preview           `npm run deploy:preview`    → Worker navweather-preview  (test data)
#   production        `npm run deploy:production` → Worker navweather          (real users)
# Bindings below are repeated per environment on purpose: wrangler does not inherit them (scripts/check-wrangler-envs.mjs
# keeps the three in step, in CI).
name = "navweather-dev"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the API runs code; everything else is served straight from assets (free, not counted as Worker requests),
# with public/_headers applied.
run_worker_first = ["/api/*"]

# Durable Object classes and their storage migrations (inherited by every environment). SQLite-backed: the only kind
# the Free plan offers.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveShare"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reports"]

# Logs without location data (DP-3.3): no invocation logs (they would carry request URLs — share ids), query strings
# redacted from traces; the Worker itself logs nothing. Free plan: 200,000 log events a day, no charge.
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "LIVE_SHARE"
class_name = "LiveShare"

[[durable_objects.bindings]]
name = "REPORTS"
class_name = "Reports"

# Per-client abuse guards (REQ-CF-003): one client cannot use up the day's free requests for everyone.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "REPORT_LIST_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "SHARE_LIMITER"
namespace_id = "1009"
simple = { limit = 240, period = 60 }

