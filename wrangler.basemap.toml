# Our map background (ADR-020, REQ-MAP-003): a Worker with static assets only — no code, no bindings, Free plan, so
# it can never bill and its requests are free and unlimited. Built by .github/workflows/basemap.yml
# (pipelines/basemap/build.mjs → dist-basemap/) and deployed with
#   npx wrangler deploy -c wrangler.basemap.toml --env production
# The app reads it from another origin (VITE_BASEMAP_URL; CORS and caching in dist-basemap/_headers).
name = "navweather-basemap-dev"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist-basemap"
not_found_handling = "none"

[env.preview]
name = "navweather-basemap-preview"

[env.production]
name = "navweather-basemap"
